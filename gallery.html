        { id: 15, src: 'images/微信图片_20251107234830_24493_88.jpg', title: '梦中的微笑', desc: '睡着睡着突然笑了，是梦到什么开心的事了呀？', cat: 'sleep', tag: '睡颜', likes: 412, date: '2025.10.20' },
        { id: 16, src: 'images/微信图片_20251107234828_24492_88.jpg', title: '静谧时光', desc: '呼吸轻轻的，小胸脯一起一伏，太可爱了', cat: 'sleep', tag: '睡颜', likes: 367, date: '2025.10.20' },
        { id: 17, src: 'images/微信图片_20251106103437_24045_88.jpg', title: '第一次对我笑', desc: '洵洵第一次社会性微笑！不是睡梦中的笑，是真正看着我笑了，眼泪都快出来了', cat: 'milestone', tag: '第一次微笑', likes: 888, date: '2025.11.12', featured: true },
        { id: 18, src: 'images/微信图片_20251104151752_23613_88.jpg', title: '满月啦', desc: '我们洵洵满月啦！从今天起就是一个月的大宝宝了～', cat: 'milestone', tag: '满月', likes: 999, date: '2025.10.17' },
        { id: 19, src: 'images/微信图片_20251029013752_21752_88.jpg', title: '皱巴巴的小老头', desc: '刚出生的时候皱巴巴的，现在看看变化好大呀', cat: 'daily', tag: '新生儿', likes: 521, date: '2025.09.25' },
        { id: 20, src: 'images/微信图片_20251028094334_21479_88.jpg', title: '你好，世界', desc: '来到这个世界的第一天，请多指教呀', cat: 'milestone', tag: '出生', likes: 1314, date: '2025.09.17', featured: true },
        { id: 21, src: 'images/微信图片_20251013173313_386_99.jpg', title: '全家福', desc: '我们的小家，因为你的到来变得更加完整', cat: 'family', tag: '全家福', likes: 888, date: '2025.09.30' },
        { id: 22, src: 'images/微信图片_20251011091729_17657_88.jpg', title: '小小的手掌', desc: '你的小手紧紧握着我的手指，那一刻觉得什么都值了', cat: 'daily', tag: '感动', likes: 666, date: '2025.09.17' },
    ];

    let currentCat = 'all';
    let currentDetailId = null;
    let likedPhotos = new Set();

    function render(list) {
        const grid = document.getElementById('photoGrid');
        grid.innerHTML = list.map(p => `
            <div class="break-inside-avoid relative rounded-[24px] overflow-hidden shadow-cozy bg-surface group cursor-pointer" onclick="openDetail(${p.id})">
                <img class="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-500" src="${p.src}" alt="${p.title}" loading="lazy">
                ${p.featured ? `<div class="absolute top-3 left-3 bg-surface/90 backdrop-blur-sm rounded-full px-3 py-1 font-body-cap text-cap text-tertiary flex items-center gap-1 shadow-sm">
                    <span class="material-symbols-outlined text-[14px] icon-filled">star</span>精选
                </div>` : ''}
                <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/40 to-transparent">
                    <p class="font-body-lm text-lm text-white">${p.date}</p>
                </div>
            </div>
        `).join('');
    }

    function switchCat(el, cat) {
        document.querySelectorAll('.chip').forEach(c => {
            c.classList.remove('bg-tertiary-fixed', 'text-on-tertiary-fixed', 'active');
            c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        el.classList.remove('bg-surface-container', 'text-on-surface-variant');
        el.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed', 'active');
        currentCat = cat;
        filterPhotos();
    }

    function filterPhotos() {
        const kw = document.getElementById('searchInput').value.trim().toLowerCase();
        let list = currentCat === 'all' ? photos : photos.filter(p => p.cat === currentCat);
        if (kw) {
            list = list.filter(p => p.title.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw) || p.tag.toLowerCase().includes(kw));
        }
        render(list);
    }

    function openDetail(id) {
        const p = photos.find(x => x.id === id);
        if (!p) return;
        currentDetailId = id;
        document.getElementById('detailImg').src = p.src;
        document.getElementById('detailTitle').textContent = p.title;
        document.getElementById('detailDesc').textContent = p.desc;
        document.getElementById('detailTag').textContent = p.tag;
        document.getElementById('detailDate').textContent = p.date;
        document.getElementById('detailLikes').textContent = p.likes + (likedPhotos.has(id) ? 1 : 0);
        const icon = document.getElementById('detailLikeIcon');
        if (likedPhotos.has(id)) {
            icon.classList.add('icon-filled', 'text-secondary');
        } else {
            icon.classList.remove('icon-filled', 'text-secondary');
        }
        document.getElementById('detailMask').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
        document.getElementById('detailMask').classList.add('hidden');
        document.body.style.overflow = '';
        currentDetailId = null;
        filterPhotos();
    }

    function toggleLikeDetail() {
        if (!currentDetailId) return;
        const p = photos.find(x => x.id === currentDetailId);
        if (!p) return;
        const liked = likedPhotos.has(currentDetailId);
        if (liked) {
            likedPhotos.delete(currentDetailId);
        } else {
            likedPhotos.add(currentDetailId);
        }
        document.getElementById('detailLikes').textContent = p.likes + (likedPhotos.has(currentDetailId) ? 1 : 0);
        const icon = document.getElementById('detailLikeIcon');
        if (likedPhotos.has(currentDetailId)) {
            icon.classList.add('icon-filled', 'text-secondary');
        } else {
            icon.classList.remove('icon-filled', 'text-secondary');
        }
    }

    render(photos);
</script>
</body>
</html>
